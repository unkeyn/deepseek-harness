# Fork overlay over the official dsh-base and dsh-web-app layers.
# Loader patch `name` is an expected-name guard; it does not rename a row.
# Replacements therefore disable the official row and insert a fork row with a
# unique id. The official tree remains unchanged and can be used alone.

- id: llm
  name: '@deepseek-ai/dsh-llm'
  disabled: true

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'
  disabled: true

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: model-catalog
  name: '@deepseek-ai/dsh-model-catalog'
  disabled: true

- id: compaction-policy
  name: '@deepseek-ai/dsh-compaction-policy'
  disabled: true

- id: web-search-brave
  name: '@deepseek-ai/dsh-web-search-brave'
  disabled: true

- id: web-search-firecrawl
  name: '@deepseek-ai/dsh-web-search-firecrawl'
  disabled: true

- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: true

# The fork ships its own fetch provider and always exposes `web_fetch`, so the
# official row (configured `fetch: false` by the base layer) is replaced.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- id: api-gateway
  name: '@deepseek-ai/dsh-host-apiproxy'
  disabled: true

- id: cordis-client-runner
  name: '@deepseek-ai/dsh-cordis-client-runner'
  disabled: true

- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- id: ui-conversation
  name: '@deepseek-ai/dsh-client-ui-conversation'
  disabled: true

- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true

- id: ui-settings-models
  name: '@deepseek-ai/dsh-client-ui-settings-models'
  disabled: true

- id: ui-settings-plugins
  name: '@deepseek-ai/dsh-client-ui-settings-plugins'
  disabled: true

- insert:
    - id: llm-fork
      name: '@deepseek-ai/dsh-fork-llm'

    - id: llm-retry-fork
      name: '@deepseek-ai/dsh-fork-llm-retry'

    - id: llm-pi-ai-fork
      name: '@deepseek-ai/dsh-fork-llm-pi-ai'

    - id: llm-deepseek-fork
      name: '@deepseek-ai/dsh-fork-llm-deepseek'

    # Freebuff stays panel-only: the OAuth tab, its credential service, and
    # the RPC bridge are mounted, while the llm-freebuff provider route and
    # the /freebuff-login command remain unmounted packages. Remount them by
    # inserting `llm-freebuff` (@deepseek-ai/dsh-fork-llm-freebuff) and
    # `command-freebuff-login` (@deepseek-ai/dsh-fork-command-freebuff) rows.
    - id: credential-freebuff-oauth
      name: '@deepseek-ai/dsh-fork-credential-freebuff-oauth'
      config: {}

    # The agent-mode roster: the model routes itself between the modes
    # (select_mode) and delegates to mode subtypes (subagent_<mode>); the
    # composer menu assigns each mode its model and custom instruction
    # through the agent-mode-assignments settings namespace. Only the angel
    # companion needs config (its provider/model); without it the toggle
    # refuses with a clear message.
    - id: agent-model-selections
      name: '@deepseek-ai/dsh-fork-agent-model-selection'

    - id: agent-modes
      name: '@deepseek-ai/dsh-fork-agent-modes'
      config: {}
      # Optional angel companion (provider/model are required when present):
      # config:
      #   angel: { provider: deepseek-official, model: deepseek-chat }

    - id: web-fork
      name: '@deepseek-ai/dsh-fork-web'
      # The pool leads the route so user-configured keys are preferred; an
      # empty, exhausted, or cooling pool is skipped and the official DeepSeek
      # provider answers instead.
      config:
        searchProviders: [custom-pool, deepseek-official]

    - id: web-fetch-fork
      name: '@deepseek-ai/dsh-fork-web-fetch-http'

    - id: tool-web-fork
      name: '@deepseek-ai/dsh-tool-web'
      # `fetch` keeps its schema default (true); only the base layer's search
      # timeout choice is carried over.
      config:
        searchTimeoutMs: 60000

    - id: compaction-basic-fork
      name: '@deepseek-ai/dsh-fork-compaction-basic'

    - id: api-gateway-fork
      name: '@deepseek-ai/dsh-fork-host-apiproxy'

    - id: freebuff-rpc
      name: '@deepseek-ai/dsh-fork-host-freebuff-rpc'
      inject: [apiProxy, webServer]

    - id: cordis-client-runner-fork
      name: '@deepseek-ai/dsh-fork-cordis-client-runner'

    - id: ui-layout-fork
      name: '@deepseek-ai/dsh-fork-client-ui-layout'

    - id: ui-agent-modes
      name: '@deepseek-ai/dsh-fork-client-ui-agent-modes'

    - id: ui-conversation-fork
      name: '@deepseek-ai/dsh-fork-client-ui-conversation'

    - id: ui-model-selection-fork
      name: '@deepseek-ai/dsh-fork-client-ui-model-selection'

    - id: ui-settings-models-fork
      name: '@deepseek-ai/dsh-fork-client-ui-settings-models'

    - id: ui-settings-plugins-fork
      name: '@deepseek-ai/dsh-fork-client-ui-settings-plugins'

    - id: ui-freebuff-oauth
      name: '@deepseek-ai/dsh-fork-client-ui-freebuff-oauth'

    # Harvest-mode interface: self-gating on the session summary's
    # agentPreset field, so its Harvest view tab (auto-opened onto the
    # console) exists only in sessions composed from the user's `harvest`
    # preset.
    - id: ui-harvest
      name: '@deepseek-ai/dsh-fork-client-ui-harvest'

    - id: model-catalog-fork
      name: '@deepseek-ai/dsh-fork-model-catalog'

    - id: compaction-policy-fork
      name: '@deepseek-ai/dsh-fork-compaction-policy'

    # Model-facing budget awareness for sessions with a per-session context
    # cap; without the fork compaction policy or a cap it renders nothing.
    - id: budget-context
      name: '@deepseek-ai/dsh-fork-budget-context'

    # The official credentials service remains the value-free reference
    # provider. This row adds the fork's durable pool capability beside it:
    # pool metadata and health persist through the settings document, secrets
    # keep resolving through ctx.credentials, and the user's pools are edited
    # on the Models page's provider editors.
    - id: key-pool
      name: '@deepseek-ai/dsh-fork-key-pool'

    - id: web-search-brave-fork
      name: '@deepseek-ai/dsh-fork-web-search-brave'
      config: {}

    - id: web-search-firecrawl-fork
      name: '@deepseek-ai/dsh-fork-web-search-firecrawl'
      config: {}

    - id: web-search-pool
      name: '@deepseek-ai/dsh-fork-web-search-pool'
