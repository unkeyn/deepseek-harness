packages:
  - bundle
  - desktop-bundle
  - packages/*/*
  - ../vendor/*
  - ../native/landlock-run
  - ../native/landlock-run/packages/*
  - ../packages/*/*
  - ../apps/*
  - ../website
  - ../examples
  - ../python/sdk-runtime

allowBuilds:
  # Keep the fork workspace's reviewed lifecycle policy aligned with the
  # upstream workspace it composes over.
  esbuild: true
  node-pty: true
  koffi: true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false

linkWorkspacePackages: true

overrides:
  '@deepseek-ai/cosmokit': 'link:../vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:../vendor/schemastery'
