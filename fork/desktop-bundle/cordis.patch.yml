# Desktop overlay over the latest upstream base/web-app layers.
# Upstream composition remains intact; only the fork package rows below are
# inserted or replaced by id. This keeps future upstream updates reviewable.

# The fork LLM stack owns the same public services as the upstream adapters.
- id: llm
  name: '@deepseek-ai/dsh-llm'
  disabled: true
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'
  disabled: true
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: true
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

# The fork web row routes search through the fork pool while retaining the
# upstream Web UI and model-facing tool seams.
- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: true
- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  disabled: true

# The stock DeepSeek search route is dead in this deployment and is disabled
# rather than repaired. Two reasons, both structural:
#   1. `DeepSeekSearchProvider.available()` returns true whenever a credential
#      resolver exists, and `@deepseek-ai/dsh-web-search-deepseek` always
#      supplies one — so the route can never skip it at selection time.
#   2. Its call then 401s: it posts to the Anthropic-compatible Messages
#      endpoint (`https://api.deepseek.com/anthropic/v1/messages`) with the
#      native `web_search_20250305` server tool, and every key here is rejected
#      there ("Authentication Fails, Your api key ... is invalid").
# Sitting last in the search route, it turned any moment the pool could not
# serve into a hard WEB_PROVIDER_CHAIN_FAILED instead of a clean failure.
# The row's id is also removed from `web-fork`'s route below: the fork seam
# treats a route naming an unregistered provider as
# WEB_PROVIDER_CONFIGURED_MISSING, not as a missing fallback to skip.
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true

# Web-app disables the host compaction row because standard agent presets own
# it. The launcher supplies a generated fork-standard preset whose nested row
# points at the fork compaction implementation.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true
- id: ui-settings-models
  name: '@deepseek-ai/dsh-client-ui-settings-models'
  disabled: true

- insert:
    # The current pi-ai adapter registers its provider OAuth flows through the
    # upstream authorization service. Keep that service mounted in the desktop
    # composition so OAuth is available to the runtime instead of being silently
    # dropped when the optional injection is unresolved.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: authorization-controller-fork
      name: '@deepseek-ai/dsh-fork-authorization-controller'
    - id: llm-fork
      name: '@deepseek-ai/dsh-fork-llm'
    - id: llm-bearer-fork
      name: '@deepseek-ai/dsh-fork-llm-bearer'
    - id: llm-bearer-mcp-bridge-fork
      name: '@deepseek-ai/dsh-fork-llm-bearer-mcp-bridge'
    - id: llm-retry-fork
      name: '@deepseek-ai/dsh-fork-llm-retry'
    - id: llm-pi-ai-fork
      name: '@deepseek-ai/dsh-fork-llm-pi-ai'
    - id: llm-deepseek-fork
      name: '@deepseek-ai/dsh-fork-llm-deepseek'
    # Paste-a-batch API key check: the host half owns the provider directory
    # and the probe, so the browser never names a URL.
    - id: llm-key-check-fork
      name: '@deepseek-ai/dsh-fork-llm-key-check'
      config: {}

    # Fork catalog, compaction policy, model-aware budget context, and
    # multi-key credential failover are host services used by the adapters.
    - id: model-catalog-fork
      name: '@deepseek-ai/dsh-fork-model-catalog'
    - id: compaction-policy-fork
      name: '@deepseek-ai/dsh-fork-compaction-policy'
    - id: budget-context-fork
      name: '@deepseek-ai/dsh-fork-budget-context'
    - id: key-pool-fork
      name: '@deepseek-ai/dsh-fork-key-pool'

    # Mode routing and its per-mode assignment UI. The current upstream
    # conversation/model/settings components remain the owners of their seams.
    - id: agent-model-selections-fork
      name: '@deepseek-ai/dsh-fork-agent-model-selection'
    - id: agent-modes-fork
      name: '@deepseek-ai/dsh-fork-agent-modes'
      config: {}
    - id: ui-agent-modes-fork
      name: '@deepseek-ai/dsh-fork-client-ui-agent-modes'

    # Fork web search transport and providers. custom-pool leads: it is the
    # only route whose credentials resolve from the managed store, so it is
    # the one that actually serves. brave stays registered as a key-less
    # fallback — it lights up on its own if its key ever appears in the
    # launch environment, and an unavailable provider is simply skipped by
    # the route. deepseek-official is gone (see the disable above).
    # firecrawl-fork removed: its keys live in the credentials store, but the
    # fork provider reads them from the launch environment (process env /
    # .env), so it was permanently unavailable. The pool's own firecrawl keys
    # are served by custom-pool instead.
    - id: web-fork
      name: '@deepseek-ai/dsh-fork-web'
      config:
        searchProviders: [custom-pool, brave]
        fetchProvider: http
    - id: web-fetch-fork
      name: '@deepseek-ai/dsh-fork-web-fetch-http'
    - id: web-search-pool-fork
      name: '@deepseek-ai/dsh-fork-web-search-pool'
    - id: web-search-brave-fork
      name: '@deepseek-ai/dsh-fork-web-search-brave'
      config: {}

    # Fork browser add-ons restore the old mode panel and web-search/key-pool
    # controls in current upstream UI locations.
    - id: ui-settings-plugins-fork
      name: '@deepseek-ai/dsh-fork-client-ui-settings-plugins'
    - id: ui-settings-models-fork
      name: '@deepseek-ai/dsh-fork-client-ui-settings-models'
    # Registers into the Models page's footer seat, which this row's own
    # registration declares, so the CHECK button sits under the provider rows.
    - id: ui-key-check-fork
      name: '@deepseek-ai/dsh-fork-client-ui-key-check'
    - id: ui-authorization-fork
      name: '@deepseek-ai/dsh-fork-client-ui-authorization'
    - id: ui-oauth-grid-fork
      name: '@deepseek-ai/dsh-fork-client-ui-oauth-grid'
      disabled: true

    # The harvest console row is NOT tracked here: `fork/packages/harvest/`
    # stays untracked, so the published bundle would name a package a fresh
    # clone cannot resolve. The desktop launcher inserts this row into its
    # profile patch layer when the checkout has the plugin (see
    # `DeepSeek Harness Desktop.ps1`).
