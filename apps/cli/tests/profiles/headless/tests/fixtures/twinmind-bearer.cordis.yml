# Keyless assembled snapshot for the custom TwinMind Bearer route. The test
# supplies a local SSE endpoint and a non-secret synthetic JWT through the
# launch environment; the profile carries references only.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        disabled: true
      - insert:
          - id: llm-bearer
            name: '../../packages/llm/llm-bearer/src/index.ts'
            config:
              providers:
                twinmind:
                  auth:
                    type: bearer
                    accessTokenEnv: TWINMIND_BEARER_TOKEN
                  api: twinmind-chat
                  baseURL: !!js process.env.TWINMIND_SNAPSHOT_BASE_URL
                  models:
                    - id: auto
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: twinmind
              model: auto
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless TwinMind Bearer provider snapshot.'
